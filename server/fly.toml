# Fly.io configuration for the Trains Party API.
# Single machine + a persistent volume for SQLite (see CLAUDE.md deploy doctrine).
# Bootstrap once: `fly apps create trains-party` and
# `fly volumes create trains_data --size 1 --region ams`.

app = "trains-party"
primary_region = "ams"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  # Sleep the machine after this many ms of no real traffic (0 disables).
  IDLE_SHUTDOWN_MS = "3600000"

[mounts]
  source = "trains_data"
  destination = "/data"

# Scale to zero. The app owns the stop decision (see server/src/idle.ts): after
# ~1h of no real traffic it exits cleanly and the machine stops; Fly Proxy
# auto-starts it on the next request (brief cold start). auto_stop is "off" so
# Fly's own minutes-grained stop doesn't preempt the 1h grace.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
