<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Trains Party">
  <rect width="32" height="32" rx="7" fill="#102a3a"/>
  <g stroke="#12222e" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
    <!-- cowcatcher -->
    <path d="M7.5 20.5 L4 24 L7.5 24 Z" fill="#e89b2a"/>
    <!-- one continuous body: boiler flowing into a taller cab -->
    <path d="M18 11 L26 11 L26 24 L7 24 L7 16.5 Q7 15.5 8 15.5 L18 15.5 Z" fill="#f5c542"/>
  </g>
  <!-- funnel -->
  <path d="M9.6 15.5 L10 11.5 L8.6 11.5 L8.6 10.4 L12 10.4 L12 11.5 L11 11.5 L11.4 15.5 Z" fill="#16242f"/>
  <!-- cab window + headlight -->
  <rect x="19.5" y="13.5" width="4.2" height="3.4" rx="0.8" fill="#16323f"/>
  <circle cx="8.3" cy="18.2" r="0.95" fill="#fff3c4"/>
  <!-- wheels -->
  <g stroke="#12222e" stroke-width="0.9"><circle cx="11" cy="23.6" r="2.9" fill="#13212e"/><circle cx="19.5" cy="23.6" r="2.9" fill="#13212e"/></g>
  <g fill="#ffd866"><circle cx="11" cy="23.6" r="1"/><circle cx="19.5" cy="23.6" r="1"/></g>
  <!-- confetti -->
  <rect x="14" y="6.5" width="2.2" height="2.2" rx="0.5" fill="#e85d4a" transform="rotate(20 15 7.5)"/>
  <circle cx="23.5" cy="7.5" r="1.1" fill="#4ec0c0"/>
  <circle cx="18.5" cy="5" r="0.85" fill="#f5c542"/>
</svg>
