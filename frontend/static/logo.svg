<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trains Party">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a4f"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd866"/>
      <stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
    <clipPath id="badge"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- hex frame (a nod to the map), centered, enclosing the train, red border -->
    <polygon points="256,52 433,154 433,358 256,460 79,358 79,154"
             fill="none" stroke="#e0392b" stroke-width="12" stroke-linejoin="round"/>

    <!-- confetti -->
    <g opacity="0.95">
      <rect x="130" y="96" width="20" height="20" rx="4" fill="#e85d4a" transform="rotate(20 140 106)"/>
      <rect x="364" y="92" width="18" height="18" rx="4" fill="#4ec0c0" transform="rotate(-18 373 101)"/>
      <circle cx="392" cy="150" r="9" fill="#f5c542"/>
      <circle cx="250" cy="80" r="7" fill="#e85d4a"/>
      <rect x="320" y="132" width="15" height="15" rx="3" fill="#f5c542" transform="rotate(-24 327 139)"/>
    </g>

    <!-- the whole locomotive, centered in the badge -->
    <g transform="translate(21 -54)">
      <g stroke="#12222e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
        <!-- cowcatcher / pilot, tucked in front of the smokebox -->
        <path d="M120 332 L72 372 L120 372 Z" fill="#e89b2a"/>

        <!-- one continuous locomotive body: low boiler flowing into a taller cab -->
        <path d="M286 206
                 L398 206
                 L398 360
                 L110 360
                 L110 276
                 Q110 260 126 260
                 L286 260
                 Z" fill="url(#body)"/>

        <!-- domes bulging out of the boiler top (open arcs: no seam line on the boiler) -->
        <path d="M168 260 A22 22 0 0 1 212 260" fill="url(#body)"/>
        <path d="M232 260 A16 16 0 0 1 264 260" fill="url(#body)"/>
      </g>

      <!-- flared funnel on the smokebox -->
      <path d="M150 260 L158 222 L142 222 L142 212 L196 212 L196 222 L180 222 L188 260 Z"
            fill="#16242f" stroke="#12222e" stroke-width="6" stroke-linejoin="round"/>

      <!-- cab window and headlight -->
      <rect x="312" y="226" width="58" height="46" rx="9" fill="#16323f" stroke="#12222e" stroke-width="6"/>
      <circle cx="126" cy="296" r="13" fill="#fff3c4" stroke="#12222e" stroke-width="5"/>

      <!-- frame + wheels + coupling rod -->
      <rect x="116" y="356" width="280" height="14" fill="#0c1a26"/>
      <rect x="150" y="392" width="170" height="9" rx="4.5" fill="#34607a"/>
      <g stroke="#12222e" stroke-width="8">
        <circle cx="170" cy="372" r="42" fill="#13212e"/>
        <circle cx="300" cy="372" r="42" fill="#13212e"/>
      </g>
      <g fill="#ffd866">
        <circle cx="170" cy="372" r="13"/>
        <circle cx="300" cy="372" r="13"/>
      </g>

      <!-- smoke rising from the funnel, breaking into confetti -->
      <g>
        <circle cx="169" cy="196" r="17" fill="#1d4357"/>
        <circle cx="150" cy="170" r="13" fill="#22506a"/>
        <circle cx="186" cy="160" r="11" fill="#22506a"/>
        <circle cx="160" cy="142" r="8" fill="#e85d4a"/>
        <circle cx="198" cy="132" r="7" fill="#4ec0c0"/>
        <rect x="176" y="116" width="14" height="14" rx="3" fill="#f5c542" transform="rotate(18 183 123)"/>
      </g>
    </g>
  </g>
</svg>
